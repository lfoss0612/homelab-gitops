# python-refactoring MCP server
# Python refactoring MCP server (stdio upstream), bridged to streamable
# HTTP via supergateway (dockerfiles/python-refactoring).

image:
  repository: ghcr.io/lfoss0612/mcp-python-refactoring
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

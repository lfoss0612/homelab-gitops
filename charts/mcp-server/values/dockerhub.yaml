# dockerhub MCP server
# Docker's official Docker Hub MCP server (stdio upstream), bridged to
# streamable HTTP via supergateway (dockerfiles/dockerhub).

image:
  repository: ghcr.io/lfoss0612/mcp-dockerhub
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic dockerhub-mcp-env \
#     --from-literal=HUB_USERNAME=... \
#     --from-literal=HUB_PAT_TOKEN=...
envFromSecrets:
  - dockerhub-mcp-env

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

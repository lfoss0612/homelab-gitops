# memory MCP server
# Reference knowledge-graph memory server (stdio upstream), bridged to
# streamable HTTP via supergateway (dockerfiles/memory).

image:
  repository: ghcr.io/lfoss0612/mcp-memory
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

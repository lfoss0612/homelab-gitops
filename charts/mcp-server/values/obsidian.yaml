# obsidian MCP server
# Obsidian MCP server (stdio upstream); talks to the Obsidian Local REST
# API plugin. Bridged to streamable HTTP via supergateway
# (dockerfiles/obsidian).

image:
  repository: ghcr.io/lfoss0612/mcp-obsidian
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic obsidian-mcp-env \
#     --from-literal=OBSIDIAN_API_KEY=... \
#     --from-literal=OBSIDIAN_HOST=...
envFromSecrets:
  - obsidian-mcp-env

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

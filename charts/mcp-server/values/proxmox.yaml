# proxmox MCP server
# Proxmox VE management server (stdio upstream), bridged to streamable
# HTTP via supergateway (dockerfiles/proxmox).

image:
  repository: ghcr.io/lfoss0612/mcp-proxmox
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic proxmox-mcp-env \
#     --from-literal=PROXMOX_HOST=... \
#     --from-literal=PROXMOX_USER=... \
#     --from-literal=PROXMOX_TOKEN_NAME=... \
#     --from-literal=PROXMOX_TOKEN_VALUE=...
envFromSecrets:
  - proxmox-mcp-env

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

# sequentialthinking MCP server
# Reference sequential-thinking server (stdio upstream), bridged to
# streamable HTTP via supergateway (dockerfiles/sequentialthinking).

image:
  repository: ghcr.io/lfoss0612/mcp-sequentialthinking
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

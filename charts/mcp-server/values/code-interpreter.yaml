# code-interpreter MCP server
# Code interpreter MCP server (stdio upstream), bridged to streamable HTTP
# via supergateway (dockerfiles/code-interpreter).

image:
  repository: ghcr.io/lfoss0612/mcp-code-interpreter
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Wrapper images serve /healthz via supergateway.
probes:
  enabled: true

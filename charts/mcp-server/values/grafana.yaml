# grafana MCP server
# Official Grafana MCP server. The image's own default args start it on SSE
# transport (confirmed live: "Starting Grafana MCP server using SSE
# transport"), which LiteLLM's streamable-HTTP MCP client can't speak to -
# override to streamable-http explicitly. Its default -allowed-hosts also
# only accepts loopback variants of -address, which rejects every in-cluster
# caller (same Host-header rejection pattern hit on huggingface) - widen it
# to the Service's cluster-local DNS name.

image:
  repository: mcp/grafana
  tag: latest
  pullPolicy: Always

args:
  - "-t"
  - "streamable-http"
  - "-address"
  - "0.0.0.0:8000"
  - "-allowed-hosts"
  - "mcp-grafana.mcp.svc.cluster.local:8000,localhost:8000"

containerPort: 8000

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic grafana-mcp-env \
#     --from-literal=GRAFANA_URL=... \
#     --from-literal=GRAFANA_SERVICE_ACCOUNT_TOKEN=...
envFromSecrets:
  - grafana-mcp-env

ingress:
  enabled: false
  className: nginx
  host: grafana.mcp.homelab.local
  tls:
    enabled: false

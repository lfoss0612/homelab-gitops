# google-workspace MCP server
# workspace-mcp wrapper image (dockerfiles/google-workspace): Gmail, Calendar
# and Drive over native streamable HTTP on :8000 (/mcp).
#
# OAuth tokens are kept on a small Longhorn PVC so they survive restarts.

image:
  repository: ghcr.io/lfoss0612/mcp-google-workspace
  tag: latest
  pullPolicy: Always

containerPort: 8000

# Credential store location (inside the PVC mount).
env:
  - name: WORKSPACE_MCP_CREDENTIALS_DIR
    value: /home/mcp/.credentials
  # The image defaults the base URI to http://0.0.0.0, which makes the OAuth
  # redirect http://0.0.0.0:8000/oauth2callback: unreachable from a browser and
  # rejected by Google. Pin it to loopback and authorize through a port-forward:
  #   kubectl -n mcp port-forward svc/mcp-google-workspace 8000:80
  # then register http://localhost:8000/oauth2callback as an authorized redirect
  # URI on the Google OAuth client (Web application type; Desktop clients accept
  # loopback redirects automatically).
  - name: WORKSPACE_MCP_BASE_URI
    value: http://localhost
  - name: GOOGLE_OAUTH_REDIRECT_URI
    value: http://localhost:8000/oauth2callback

persistence:
  enabled: true
  mountPath: /home/mcp/.credentials
  size: 100Mi
  storageClass: longhorn

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic google-workspace-mcp-env \
#     --from-literal=GOOGLE_OAUTH_CLIENT_ID=... \
#     --from-literal=GOOGLE_OAUTH_CLIENT_SECRET=...
envFromSecrets:
  - google-workspace-mcp-env

ingress:
  enabled: false
  className: nginx
  host: google-workspace.mcp.homelab.local
  tls:
    enabled: false

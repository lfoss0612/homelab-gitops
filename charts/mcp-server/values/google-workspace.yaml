# google-workspace MCP server
# workspace-mcp wrapper image (dockerfiles/google-workspace): Gmail, Calendar
# and Drive over native streamable HTTP on :8000 (/mcp).
#
# OAuth tokens are kept on a small Longhorn PVC so they survive restarts.

image:
  repository: ghcr.io/lfoss0612/mcp-google-workspace
  tag: latest
  pullPolicy: Always

containerPort: 8000

# Create this Secret out-of-band before syncing, e.g.:
#   kubectl -n mcp create secret generic google-workspace-mcp-env \
#     --from-literal=GOOGLE_OAUTH_CLIENT_ID=... \
#     --from-literal=GOOGLE_OAUTH_CLIENT_SECRET=...
# Credential store location (inside the PVC mount).
env:
  - name: WORKSPACE_MCP_CREDENTIALS_DIR
    value: /home/mcp/.credentials

persistence:
  enabled: true
  mountPath: /home/mcp/.credentials
  size: 100Mi
  storageClass: longhorn

envFromSecrets:
  - google-workspace-mcp-env

ingress:
  enabled: false
  className: nginx
  host: google-workspace.mcp.homelab.local
  tls:
    enabled: false

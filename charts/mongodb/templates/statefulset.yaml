apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
          ports:
            - {name: mongodb, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: username}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: password}}
          volumeMounts:
            - {name: data, mountPath: /data/db}
          readinessProbe:
            tcpSocket: {port: mongodb}
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket: {port: mongodb}
            initialDelaySeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

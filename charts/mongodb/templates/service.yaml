apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: mongodb, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: mongodb, port: {{ .Values.service.port }}, targetPort: mongodb}

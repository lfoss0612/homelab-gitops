apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  destination:
    namespace: open-webui
    server: https://kubernetes.default.svc
  project: ai
  source:
    chart: open-webui
    helm:
      parameters:
        - name: persistence.storageClass
          value: longhorn
        - name: ollama.persistentVolume.enabled
          value: "true"
        - name: ollama.persistentVolume.size
          value: "644245094400"
        # 1-replica class: the 600Gi model store can't place a second replica on
        # this cluster. The PVC binds to the pre-declared PV
        # `open-webui-ollama-restored` (argocd/longhorn-system/
        # pv-open-webui-ollama-restored.yaml), a volume restored from backup
        # 2026-09-20. Models are re-pullable and the daily backup covers it.
        - name: ollama.persistentVolume.storageClass
          value: longhorn-single
        - name: ollama.runtimeClassName
          value: nvidia
        # Pinned explicitly (was floating on the open-webui chart's own
        # bundled default). 0.31.1 -> 0.33.2, 2026-08-29: checked upstream
        # changelogs for 0.32.x/0.33.x, no breaking changes or env var
        # behavior changes found (OLLAMA_NUM_PARALLEL/FLASH_ATTENTION/
        # KV_CACHE_TYPE/MAX_LOADED_MODELS/KEEP_ALIVE all unaffected).
        # 0.33.2 -> 0.40.16, 2026-11-15: no env var changes found. NOTE since
        # 0.40.2: models are converted in the background on first run and the
        # original is kept as a backup, so the 590G volume (421G used) fills
        # as models are used; see the v0.40.2 release notes for the cleanup
        # snippet. The image bundles its own CUDA 12/13 runtime; the host
        # driver (615.x, CUDA 13.4) is newer than what it needs.
        - name: ollama.image.tag
          value: "0.40.18"
        # Bundled websocket Redis (no persistence, only websocket session state).
        # 7.4.2 -> 7.4.12 (2026-11-16): newest 7.4 patch on the same Alpine base;
        # deliberately not crossing to Redis 8.x.
        - name: websocket.redis.image.tag
          value: 7.4.12-alpine3.21
        - name: persistence.size
          value: 10Gi
        # GPU memory tuning: the RTX 5090 is shared with vllm (which holds a
        # static ~14.5 GiB), so keep one model resident at a time, fully on
        # GPU, with flash attention + q8_0 KV cache to stretch the headroom.
        - name: ollama.extraEnv[0].name
          value: OLLAMA_NUM_PARALLEL
        - forceString: true
          name: ollama.extraEnv[0].value
          value: "1"
        - name: ollama.extraEnv[1].name
          value: OMP_NUM_THREADS
        - forceString: true
          name: ollama.extraEnv[1].value
          value: "8"
        - name: ollama.extraEnv[2].name
          value: OLLAMA_FLASH_ATTENTION
        - forceString: true
          name: ollama.extraEnv[2].value
          value: "1"
        - name: ollama.extraEnv[3].name
          value: OLLAMA_KV_CACHE_TYPE
        - forceString: true
          name: ollama.extraEnv[3].value
          value: q8_0
        - name: ollama.extraEnv[4].name
          value: OLLAMA_MAX_LOADED_MODELS
        - forceString: true
          name: ollama.extraEnv[4].value
          value: "2"
        - name: ollama.extraEnv[5].name
          value: OLLAMA_KEEP_ALIVE
        - forceString: true
          name: ollama.extraEnv[5].value
          value: "30m"
        # Resource limits: host VM (pve-ai/k8s-worker-2) was cut from 48GB to
        # 16GB after repeated OOM-driven host freezes on 2026-09-26/27 (see
        # homelab-ansible host_vars/pve-ai.home.lan.yml and Claude memory
        # project_pve-ai-ollama-oom-incident.md). Now that the GPU (RTX 5090,
        # 32GB VRAM) holds full model weights, system RAM no longer needs to
        # cover CPU-offloaded layers - sized well under the new VM ceiling so
        # a runaway container gets cleanly OOM-killed instead of starving the
        # host again.
        - name: ollama.resources.requests.memory
          value: 2Gi
        - name: ollama.resources.limits.memory
          value: 8Gi
        - name: runtimeClassName
          value: nvidia
        - name: replicaCount
          value: "1"
        # NOTE: this is ollama.replicaCount (the otwld/ollama-helm subchart's
        # own value), NOT the bare replicaCount above, which controls the
        # main open-webui StatefulSet - conflating the two briefly scaled the
        # main app to 0 by mistake. Was paused at 0 during PVC recovery
        # (host OOM incidents 2026-09-26/27, see Claude memory
        # project_pve-ai-ollama-oom-incident.md); PVC now re-pointed to a
        # fresh restored volume (open-webui-ollama) and confirmed stable.
        - name: ollama.replicaCount
          value: "1"
        - name: service.type
          value: LoadBalancer
        - name: extraEnvFrom[0].secretRef.name
          value: open-webui-db
        # LiteLLM OpenAI-compatible API backend (http://litellm.litellm.svc.cluster.local:8080)
        - name: extraEnv[0].name
          value: OPENAI_API_BASE_URL
        - name: extraEnv[0].value
          value: http://litellm.litellm.svc.cluster.local:8080/v1
        - name: extraEnv[1].name
          value: OPENAI_API_KEY
        - name: extraEnv[1].value
          value: "not-needed"
    repoURL: https://helm.openwebui.com/
    # Pinned deliberately. Was '*' (auto-upgrade), which silently jumped to
    # 15.2.0 on 2026-07-18 and reinitialized an empty SQLite webui.db, losing
    # all users/settings. Bump this explicitly after reviewing release notes.
    # 2026-11-16: 15.2.0 -> 18.3.0 (app 0.10.2 -> 0.13.3). The rendered chart diff
    # is only the app image, a revisionHistoryLimit and PVC labels. The real data
    # is the `openwebui` database on Yugabyte (DATABASE_URL from the open-webui-db
    # secret), which the app migrates forward on first start, one-way: a logical
    # ysql_dump and Longhorn backups were taken first (schema was 42e2978c7933).
    targetRevision: 18.5.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

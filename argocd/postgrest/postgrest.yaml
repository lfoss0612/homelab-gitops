# Before this Application can sync successfully, create the DB/JWT secret
# out-of-band (not in git), e.g.:
#   kubectl -n postgrest create secret generic postgrest-db-secret \
#     --from-literal=PGRST_DB_URI='postgresql://authenticator:<password>@yb-tserver-service.yugabytedb.svc.cluster.local:5433/chinook' \
#     --from-literal=PGRST_JWT_SECRET='<jwt-secret>'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgrest
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/lfoss0612/homelab-gitops.git
    targetRevision: HEAD
    path: charts/postgrest
    helm:
      releaseName: postgrest
      parameters:
        - name: existingSecret
          value: postgrest-db-secret
        - name: postgrest.dbAnonRole
          value: web_anon
        # 2026-11-16: LISTEN/NOTIFY off. YugabyteDB 2025.2.8 rejects LISTEN with
        # "LISTEN/NOTIFY is disabled" unless the tserver flag
        # ysql_yb_enable_listen_notify is on (it is false by default); 2025.2.2
        # accepted it silently. PostgREST's /ready (our readiness probe) stays 503
        # while its listener cannot start. Not using the listener matches what
        # effectively happened before; schema changes now need a PostgREST restart.
        - name: postgrest.dbChannelEnabled
          value: "false"
        - name: service.type
          value: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: postgrest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - post-delete-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io/cleanup
  name: gpu-operator
  namespace: argocd
spec:
  destination:
    namespace: gpu-operator
    server: https://kubernetes.default.svc
  project: add-ons
  source:
    chart: gpu-operator
    helm:
      parameters:
        - name: driver.enabled
          value: "false"
        - name: toolkit.enabled
          value: "false"
        - name: devicePlugin.config.name
          value: time-slicing-config
        # v26.7 chart defaults that would change behaviour here, pinned to the
        # previous behaviour (2026-11-16):
        # - ccManager (Confidential Computing) flips to enabled/defaultMode on;
        #   meaningless on an RTX 5090.
        # - dcgmExporter.serviceMonitor flips to enabled; the operator's would be
        #   named nvidia-dcgm-exporter in gpu-operator, colliding with our own
        #   argocd/cattle-monitoring-system/dcgm-exporter-servicemonitor.yaml and
        #   double-scraping.
        - name: ccManager.enabled
          value: "false"
        - name: dcgmExporter.serviceMonitor.enabled
          value: "false"
    repoURL: https://helm.ngc.nvidia.com/nvidia
    targetRevision: v26.7.2

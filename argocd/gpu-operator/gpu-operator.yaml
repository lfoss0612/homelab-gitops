apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - post-delete-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io/cleanup
  name: gpu-operator
  namespace: argocd
spec:
  destination:
    namespace: gpu-operator
    server: https://kubernetes.default.svc
  project: add-ons
  source:
    chart: gpu-operator
    helm:
      parameters:
        - name: driver.enabled
          value: "false"
        - name: toolkit.enabled
          value: "false"
        - name: devicePlugin.config.name
          value: time-slicing-config
        # v26.7 chart default pinned to the previous behaviour (2026-11-16):
        # ccManager (Confidential Computing) flips to enabled/defaultMode on;
        # meaningless on an RTX 5090.
        - name: ccManager.enabled
          value: "false"
        # dcgmExporter.serviceMonitor is left at the v26.7 default (enabled): the
        # operator now creates the nvidia-dcgm-exporter ServiceMonitor itself. With
        # it disabled the operator DELETES any ServiceMonitor of that name, which
        # fought the hand-written one we used to keep in
        # argocd/cattle-monitoring-system/dcgm-exporter-servicemonitor.yaml (removed).
    repoURL: https://helm.ngc.nvidia.com/nvidia
    targetRevision: v26.7.3

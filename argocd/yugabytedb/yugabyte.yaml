apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yugabyte
  namespace: argocd
spec:
  destination:
    namespace: yugabytedb
    server: https://kubernetes.default.svc
  project: yugabyte
  source:
    chart: yugabyte
    helm:
      parameters:
        - name: replicas.master
          value: "1"
        - name: replicas.totalMasters
          value: "1"
        - name: replicas.tserver
          value: "1"
        - name: master.gflags.master_enable_universe_uuid_heartbeat_check
          value: "false"
      values: |
        serviceEndpoints:
          - name: "yb-master-ui"
            type: LoadBalancer
            scope: "AZ"
            annotations: {}
            clusterIP: ""
            externalTrafficPolicy: "Cluster"
            app: "yb-master"
            loadBalancerIP: ""
            ports:
              http-ui: "7000"
            extraArgs: {}
          - name: "yb-tserver-service"
            type: LoadBalancer
            scope: "AZ"
            annotations: {}
            clusterIP: ""
            externalTrafficPolicy: "Cluster"
            app: "yb-tserver"
            loadBalancerIP: ""
            ports:
              tcp-yql-port: "9042"
              tcp-yedis-port: "6379"
              tcp-ysql-port: "5433"
            extraArgs: {}
          - name: "yugabyted-ui-service"
            type: LoadBalancer
            scope: "AZ"
            annotations: {}
            clusterIP: ""
            externalTrafficPolicy: "Cluster"
            app: "yb-master"
            loadBalancerIP: ""
            sessionAffinity: ClientIP
            ports:
              yugabyted-ui: "15433"
            extraArgs: {}
    repoURL: https://charts.yugabyte.com
    # 2026-11-16: 2025.2.2 (2025.2.2.2-b11) -> 2025.2.8 (2025.2.8.1-b8), the newest
    # patch on the LTS line; deliberately not the 2026.1 STS line. NOTE this chart
    # drops `release: yugabyte` from the yb-master/yb-tserver StatefulSet selectors,
    # and selectors are immutable, so the StatefulSet objects had to be deleted with
    # `--cascade=orphan` (pods and PVCs keep running) for Argo to recreate them.
    # Then: yb-admin promote_auto_flags and upgrade_ysql. Longhorn backups of all
    # four volumes were taken first.
    targetRevision: 2025.2.9
  # 2026-11-24: homelab-ansible fleet-reboot.yml scales yb-tserver and yb-master to 0 before it drains a
  # node that hosts them (their PDBs allow 0 disruptions, so a graceful drain can never succeed) and back
  # to 1 afterwards. Without this, selfHeal would put the replicas back mid-reboot.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: yb-master
      jqPathExpressions:
        - .spec.replicas
    - group: apps
      kind: StatefulSet
      name: yb-tserver
      jqPathExpressions:
        - .spec.replicas
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  destination:
    namespace: litellm
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apps
      jsonPointers:
        - /spec/template/spec/dnsConfig
      kind: Deployment
      name: litellm
      namespace: litellm
  project: ai
  source:
    chart: litellm-helm
    helm:
      # Secrets are NOT inlined. They live as standalone Kubernetes Secrets in
      # the litellm namespace (created out of band, like the mcp-* servers):
      #   litellm-masterkey       (key: masterkey)               -> master key
      #   litellm-postgresql-ext  (password, postgres-password)  -> postgres auth
      #   litellm-dbcredentials   (username, password)           -> litellm DB login
      parameters:
        - name: ingress.hosts[0].host
          value: litellm.home.lan
        - name: ingress.hosts[0].paths[0].path
          value: /
        - name: ingress.hosts[0].paths[0].pathType
          value: ImplementationSpecific
        # Local vLLM server (argocd/vllm/, chart charts/vllm) serving Qwen3-8B.
        # "hosted_vllm/" routes through LiteLLM's vLLM provider; the suffix must
        # match vllm's --served-model-name.
        - name: proxy_config.model_list[0].model_name
          value: qwen3-8b
        - name: proxy_config.model_list[0].litellm_params.model
          value: hosted_vllm/qwen3-8b
        - name: proxy_config.model_list[0].litellm_params.api_base
          value: http://vllm.vllm.svc.cluster.local:8000/v1
        - name: proxy_config.general_settings.store_model_in_db
          value: "True"
        - name: proxy_config.litellm_settings.drop_params
          value: "True"  
        - name: masterkeySecretName
          value: litellm-masterkey
        - name: masterkeySecretKey
          value: masterkey
        - name: service.type
          value: LoadBalancer
        - name: postgresql.image.registry
          value: docker.io
        - name: postgresql.image.repository
          value: bitnami/postgresql
        - name: postgresql.image.tag
          value: latest
        - name: postgresql.auth.existingSecret
          value: litellm-postgresql-ext
      # Surfaced 2026-09-27: no requests/limits at all, so the scheduler had
      # no visibility into litellm's real ~1.1GB footprint on k8s-master.
      # Request set just above observed usage, limit with headroom for
      # request-routing/caching spikes.
      valuesObject:
        resources:
          requests:
            memory: 1536Mi
            cpu: 100m
          limits:
            memory: 2Gi
        # Surfaced 2026-09-27: once real requests existed, litellm and
        # prometheus-adapter both rescheduled onto k8s-worker-2 alongside a
        # rancher replica, stacking ~3.5GB onto a node with only 7.68GiB
        # total (88% used) - an uncoordinated pile-up from three independent
        # scheduling decisions, not a deliberate placement. rancher's own
        # chart hardcodes its affinity with no override hook, so this side
        # can't reciprocate - but litellm+prometheus-adapter actively
        # avoiding rancher AND each other is enough to get real spread
        # across the 3 nodes. Soft (preferred), not required: a hard
        # anti-affinity here risks Unschedulable if fewer than 3 nodes are
        # ever available. namespaces: is load-bearing - podAntiAffinity only
        # matches same-namespace pods by default, and these three charts
        # each live in a different namespace (cattle-system, litellm,
        # cattle-monitoring-system).
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values: ["rancher"]
                  namespaces: ["cattle-system"]
                  topologyKey: kubernetes.io/hostname
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["prometheus-adapter"]
                  namespaces: ["cattle-monitoring-system"]
                  topologyKey: kubernetes.io/hostname
    repoURL: ghcr.io/berriai
    # Pinned 2026-09-20. Was `1.x.x`, which drifted past the last chart this
    # values file synced with (1.95.0, 2026-08-02): newer 1.x charts refuse
    # postgresql.image.tag=latest ("must be pinned to an explicit version"),
    # so helm template failed and the app sat in ComparisonError. Bump this
    # deliberately, and pin postgresql.image.tag to the SAME MAJOR as the data
    # directory (check `postgres --version` in the pod) before moving off 1.95.0.
    targetRevision: 1.95.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
spec:
  destination:
    namespace: cattle-system
    server: https://kubernetes.default.svc
  project: system
  source:
    chart: rancher
    helm:
      # Rancher 2.15 supports Kubernetes 1.36 (chart kube-version < 1.37), so the
      # old kubeVersion override that 2.14 needed is gone.
      parameters:
        - name: ingress.ingressClassName
          value: nginx
        - name: replicas
          value: "2"
        - name: ingress.tls.source
          value: secret
        - name: ingress.tls.secretName
          value: home-lan-tls
        - name: hostname
          value: rancher.home.lan
        # Stop Rancher's own systemcharts controller from managing
        # system-upgrade-controller (chart + Plans) on the local cluster,
        # so Argo CD (argocd/cattle-system/system-upgrade-controller.yaml)
        # is the sole owner. Internal/undocumented flag - takes effect once
        # this Application is synced.
        - name: extraEnv[0].name
          value: CATTLE_FEATURES
        # turtles=false (2026-11-16): Rancher Turtles (Cluster API integration) is
        # deliberately OFF. This is a single-cluster install with no downstream
        # clusters, so nothing needs it. With it off, Rancher's systemcharts
        # controller helm-uninstalls the release and deletes cattle-turtles-system
        # on every reconcile, so it cannot be run by Argo CD either. Costs:
        # creating downstream clusters from Rancher won't work. To restore, drop
        # `turtles=false` and let Rancher reinstall it. The CAPI CRDs were left
        # behind by the uninstall (Helm does not remove CRDs).
        - name: extraEnv[0].value
          forceString: true
          value: managed-system-upgrade-controller=false,turtles=false
      # Surfaced 2026-09-27: no requests/limits at all, so the scheduler had
      # no visibility into rancher's real ~1.9GB footprint on k8s-master.
      # Observed usage at the time: 1.9GB (replica on master), 1.4GB
      # (replica on a worker) - request set below observed usage on the
      # smaller replica, with headroom in the limit for growth.
      valuesObject:
        resources:
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 2560Mi
    repoURL: https://releases.rancher.com/server-charts/latest
    targetRevision: 2.15.3
  # The chart injects CATTLE_BOOTSTRAP_PASSWORD into this Deployment via a
  # pre-install/pre-upgrade hook Secret (bootstrap-secret) read back with
  # Helm's `lookup`, which plain template rendering can never reproduce.
  # This env var will permanently diff from git; ignore it rather than
  # chase unfixable drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rancher
      namespace: cattle-system
      jsonPointers:
        - /spec/template/spec/containers/0/env

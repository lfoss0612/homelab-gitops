# No Rancher feature flag exists to opt this out of Rancher's own
# systemcharts management (unlike system-upgrade-controller). This chart
# is tightly version-coupled to the Rancher server itself, so bump
# targetRevision here manually whenever Rancher is upgraded, to avoid
# Argo's pinned version drifting behind what the new Rancher expects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-webhook
  namespace: argocd
spec:
  destination:
    namespace: cattle-system
    server: https://kubernetes.default.svc
  project: system
  source:
    chart: rancher-webhook
    helm:
      parameters:
        - name: global.cattle.systemDefaultRegistry
          value: ""
        - name: mcm.enabled
          value: "true"
        - name: priorityClassName
          value: rancher-critical
    repoURL: https://charts.rancher.io
    targetRevision: 109.0.3+up0.10.7
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # The chart's Deployment template has no replicas field at all (checked via
  # `helm pull`+`helm template` — confirmed absent, not just unexposed via
  # values), so there's no Helm parameter that can set it; Kubernetes defaults
  # an omitted spec.replicas to 1 only at creation. Set to 2 live via
  # `kubectl scale` instead (see homelab-vault DONE.md, Kubernetes, for when/why
  # — single-replica rancher-webhook doubled the 2026-08-08 Rancher outage).
  # ignoreDifferences keeps selfHeal from ever fighting that live value, same
  # reasoning as rancher.yaml's bootstrap-secret env var above.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rancher-webhook
      namespace: cattle-system
      jsonPointers:
        - /spec/replicas

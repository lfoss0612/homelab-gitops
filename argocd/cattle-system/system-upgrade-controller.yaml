# Chart version tracks the one Rancher 2.15 installs itself (system-upgrade-controller
# 110.0.0); Rancher and Argo both render this release, so keep them identical.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
spec:
  destination:
    namespace: cattle-system
    server: https://kubernetes.default.svc
  project: system
  source:
    chart: system-upgrade-controller
    helm:
      parameters:
        - name: global.cattle.systemDefaultRegistry
          value: ""
        - name: priorityClassName
          value: rancher-critical
    repoURL: https://charts.rancher.io
    targetRevision: 110.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

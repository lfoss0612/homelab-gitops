# Before this Application can sync successfully, create the root credentials
# out-of-band (not in git), e.g.:
#   kubectl create namespace mongodb
#   kubectl -n mongodb create secret generic mongodb-root \
#     --from-literal=username=root --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=')"
# Note: MONGO_INITDB_* only applies on first start of an empty volume; changing
# the secret later does not change the DB password.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/lfoss0612/homelab-gitops.git
    targetRevision: HEAD
    path: charts/mongodb
    helm:
      releaseName: mongodb
      valuesObject:
        # k8s-worker-2 runs kernel 7.0, which mongo 8.0 refuses to start on
        # (https://jira.mongodb.org/browse/SERVER-121912). Remove once a fixed
        # image tag is adopted or the node kernel is held below 6.19.
        nodeSelector:
          kubernetes.io/hostname: k8s-worker.home.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

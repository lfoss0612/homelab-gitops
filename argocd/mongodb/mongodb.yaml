# Before this Application can sync successfully, create the root credentials
# out-of-band (not in git), e.g.:
#   kubectl create namespace mongodb
#   kubectl -n mongodb create secret generic mongodb-root \
#     --from-literal=username=root --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=')"
# Note: MONGO_INITDB_* only applies on first start of an empty volume; changing
# the secret later does not change the DB password.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/lfoss0612/homelab-gitops.git
    targetRevision: HEAD
    path: charts/mongodb
    helm:
      releaseName: mongodb
      valuesObject:
        # PAUSED 2026-11-15. k8s-worker moved to Ubuntu 26.04 (kernel 7.0), and
        # mongo 8.0 refuses to start on kernels >= 6.19
        # (https://jira.mongodb.org/browse/SERVER-121912); the only node that
        # was below 6.19 is gone. The GLIBC_TUNABLES=glibc.pthread.rseq=0
        # workaround was tried (330c249, reverted in 26158ef) and the startup
        # check ignores it. The data volume (PVC data-mongodb-0, Longhorn) is
        # kept and has a manual backup from the pause. media_search, the only
        # known consumer, is unused. To resume: set replicas back to 1 once a
        # mongo release starts on Ubuntu's 7.0.0-NN kernel numbering
        # (SERVER-136848) or a node below 6.19 exists again.
        replicas: 0
        nodeSelector:
          kubernetes.io/hostname: k8s-worker.home.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

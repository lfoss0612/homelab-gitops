apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mcp-servers
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Official containers/kubernetes-mcp-server Helm chart (OCI), HTTP mode.
    # Replaces the old stdio-only mcp/kubernetes pod (charts/mcp-server).
    repoURL: ghcr.io/containers/charts
    chart: kubernetes-mcp-server
    targetRevision: 0.1.3
    helm:
      releaseName: mcp-kubernetes
      valuesObject:
        # Distinct from the old `mcp-kubernetes` Deployment/Service so the
        # switch doesn't collide on immutable selectors.
        fullnameOverride: mcp-k8s
        # ClusterIP only: LiteLLM reaches it in-cluster
        # (http://mcp-k8s.mcp.svc.cluster.local:8080/mcp).
        ingress:
          enabled: false
        config:
          port: "8080"
          # Defence in depth on top of the read-only RBAC below.
          read_only: true
          disable_destructive: true
        rbac:
          # Bind the chart's ServiceAccount to the built-in read-only `view`
          # ClusterRole (no Secrets, no writes). To allow changes later, bind
          # `edit` here AND set read_only/disable_destructive to false.
          extraClusterRoleBindings:
            - name: view
              roleRef:
                name: view
                external: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# ONE-OFF migration artifact (2026-09-20). Pre-bound static PV for the Ollama
# model store, restored from a Longhorn backup onto the 1-replica class.
# It points at the Longhorn volume `open-webui-ollama-restored`, which was
# restored by hand from backup `backup-prerestage20260920`; it does not exist
# on a from-scratch rebuild. Once the open-webui-ollama PVC is Bound to this
# PV, this file can be removed (prune is off, so the PV is left alone).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: open-webui-ollama-restored
spec:
  capacity:
    storage: 600Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-single
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: open-webui-ollama
    namespace: open-webui
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: open-webui-ollama-restored
    volumeAttributes:
      numberOfReplicas: "1"
      staleReplicaTimeout: "30"

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
  name: longhorn
  namespace: argocd
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  project: add-ons
  source:
    chart: longhorn
    helm:
      parameters:
        - name: persistence.reclaimPolicy
          value: Retain
        - name: longhornUI.replicas
          value: "2"
        - name: defaultSettings.defaultDataPath
          value: /mnt/longhorn
        - name: defaultSettings.defaultReplicaCount
          value: "1"
        - name: persistence.defaultClassReplicaCount
          value: "2"
        - name: metrics.serviceMonitor.enabled
          value: "true"
        # 1.13 renders six NetworkPolicies on the longhorn-system pods whenever
        # restrictInternalTraffic is true (the default); the chart's
        # networkPolicies.enabled flag does NOT gate them. Left on, they would
        # filter internal Longhorn traffic and block Prometheus scraping of
        # longhorn-manager (no metricsScrapeSources configured). Off keeps the
        # pre-1.13 behaviour (no policies). Revisit deliberately if wanted.
        - name: networkPolicies.restrictInternalTraffic
          value: "false"
    repoURL: https://charts.longhorn.io
    targetRevision: 1.13.0

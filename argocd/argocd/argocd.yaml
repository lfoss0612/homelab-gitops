# Argo CD managing its own Helm release. Deliberately manual sync (no
# syncPolicy.automated) - unlike other apps in this repo, a bad sync here
# could break Argo CD itself with nothing else around to fix it. Review
# the diff and sync by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: system
  source:
    chart: argo-cd
    helm:
      valuesObject:
        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        configs:
          secret:
            # Do not render/manage this Secret at all. It holds Argo CD's
            # own runtime-generated auth material (password hashes,
            # server.secretkey, TLS cert/key). ignoreDifferences was NOT
            # sufficient to protect it on a first sync - the chart omits
            # `data:` entirely when unset, and applying that wiped the
            # live secret (lost accounts.lfoss.password, tls.crt/key,
            # rotated server.secretkey) on 2026-07-05. createSecret:false
            # removes it from the rendered manifest entirely, so Argo
            # never has an opinion about it again.
            createSecret: false
          cm:
            url: https://argocd.fosshomelab.duckdns.org
            accounts.lfoss: login,apiKey
            # Read-only service account for the argocd MCP server
            # (argocd/apps/mcp-argocd.yaml). apiKey only, no login - it never
            # authenticates interactively, so it needs no password. Gets
            # role:readonly from rbac.policy.default below (no explicit
            # policy.csv grant needed). Token generated out of band:
            #   argocd account generate-token --account mcp-readonly
            accounts.mcp-readonly: apiKey
          params:
            server.insecure: true
          rbac:
            policy.csv: |
              g, lfoss, role:admin
            policy.default: role:readonly
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        global:
          # Chart 10 creates NetworkPolicies for every component by default
          # (global.networkPolicy.create: true). Off keeps today's networking
          # while upgrading Argo CD itself; revisit deliberately.
          networkPolicy:
            create: false
          cattle:
            clusterId: local
            clusterName: local
            rkePathPrefix: ""
            rkeWindowsPathPrefix: ""
            systemProjectId: p-vsnqf
            url: https://rancher.local
        repoServer:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        server:
          insecure: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          service:
            type: LoadBalancer
    repoURL: https://argoproj.github.io/argo-helm
    # 2026-11-16: 9.5.19 (v3.4.3) -> 10.18.0 (v3.6.1). Argo CD guides 3.4->3.5 and
    # 3.5->3.6 checked: Helm 4 OCI strictness only affects plain-HTTP OCI registries
    # (ours are TLS), no SSH repos, no impersonation, no OTLP settings. Workload
    # selectors are unchanged and the CRDs already carry the ServerSideApply
    # annotation (they exceed the client-side apply limit). A full export of the
    # argocd namespace (secrets, configmaps, Applications, Projects, RBAC) was taken
    # first; rollback = `kubectl apply --server-side` of the saved 9.5.19 manifest.
    targetRevision: 10.20.0

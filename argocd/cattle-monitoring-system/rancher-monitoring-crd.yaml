apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # No finalizers here on purpose: the live Application has none (Argo strips
  # them), so declaring them left the parent platform-cattle-monitoring-system
  # permanently OutOfSync. This app has no PreDelete hooks, so nothing is lost.
  name: rancher-monitoring-crd
  namespace: argocd
spec:
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  project: system
  source:
    # 2026-09-20: was the git path charts/rancher-monitoring-crd/108.0.0+up77.9.1-rancher.6
    # on github.com/rancher/charts (branch release-v2.14). That repo is so large
    # that the repo-server's `git fetch` times out (90s) after any cache reset,
    # leaving the app Unknown. The same chart version is published on the Helm
    # repo rancher-monitoring already uses; dry-run showed identical CRD content.
    chart: rancher-monitoring-crd
    repoURL: https://charts.rancher.io
    targetRevision: 108.0.0+up77.9.1-rancher.6

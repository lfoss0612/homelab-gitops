# Read-only ServiceAccount for Zabbix's official Kubernetes templates
# ("Kubernetes nodes by HTTP" etc. in homelab-ansible's zabbix.home.lan
# monitoring). Scoped to nodes/pods/namespaces/endpoints get/list/watch
# only, no write access anywhere. The actual bearer token is generated
# out-of-band (kubectl create token) and stored vault-encrypted in
# homelab-ansible, never committed here — see CLAUDE.md "Never commit
# credentials".
#
# "endpoints" added 2026-08-23: the "Kubernetes nodes by HTTP" template's
# "Get nodes" item is a single script that calls /api/v1/nodes,
# /api/v1/pods, AND /api/v1/endpoints in sequence inside one try/catch -
# a 403 on any one of them (endpoints wasn't originally granted) aborts
# the whole item, discarding the node/pod data that had already been
# fetched successfully. The endpoints call looks up a named Endpoints
# object (default {$KUBE.NODES.ENDPOINT.NAME} =
# "zabbix-zabbix-helm-chart-agent", from Zabbix's own Helm chart
# deployment pattern) to tag which node runs that agent; it doesn't exist
# in this cluster since agent2 was installed via Ansible, not the Helm
# chart, but the API call still needs to be permitted even to come back
# empty.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-monitoring
  namespace: cattle-monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zabbix-monitoring
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "pods", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  # "nodes/metrics" added 2026-08-25, get only, to unblock the "Kubernetes
  # Kubelet by HTTP" template — 30 permanently-unsupported items across the
  # three discovered Kubelet hosts, and with them per-pod CPU and memory, which
  # nothing else in this cluster's Zabbix collects. kube-state-metrics reports
  # what a pod REQUESTS, never what it uses; consumption lives in the kubelet's
  # cAdvisor endpoints and nowhere else Zabbix can currently see.
  #
  # nodes/metrics is EXACTLY what the kubelet asks for, not a guess. Probed
  # with the service account's own token against the live kubelet:
  #
  #   GET https://10.2.5.2:10250/metrics/cadvisor
  #   403 Forbidden (user=system:serviceaccount:cattle-monitoring-system:
  #        zabbix-monitoring, verb=get, resource=nodes, subresource(s)=[metrics])
  #
  # Deliberately NOT nodes/proxy, which is the permission usually cited for
  # this and which an earlier note in homelab-ansible guessed at. The kubelet
  # is scraped directly on :10250 rather than through the API server proxy, so
  # proxy access is not involved and granting it would widen this account for
  # nothing. All 30 Forbidden items are on the Kubelet hosts; the API server,
  # controller-manager and scheduler hosts have none, so no nonResourceURL
  # grant for /metrics is needed either.
  #
  # Still read-only: "get" on a metrics endpoint. It exposes per-container
  # resource usage, which is more detail than this account previously had, but
  # confers no ability to read secrets, exec, or change anything.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-monitoring
subjects:
  - kind: ServiceAccount
    name: zabbix-monitoring
    namespace: cattle-monitoring-system

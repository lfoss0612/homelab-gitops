apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-monitoring
  namespace: argocd
spec:
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  project: system
  source:
    chart: rancher-monitoring
    helm:
      parameters:
        - name: global.cattle.psp.enabled
          value: "false"
        - name: grafana.service.type
          value: LoadBalancer
        - name: grafana.service.loadBalancerIP
          value: 10.2.6.10
        - name: grafana.persistence.enabled
          value: "true"
        - name: grafana.persistence.type
          value: pvc
        - name: grafana.persistence.existingClaim
          value: grafana-dashboards
        - name: prometheus.prometheusSpec.retention
          value: 10d
        - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName
          value: longhorn
        - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage
          value: 50Gi
        - name: grafana.grafana\.ini.server.root_url
          value: "https://grafana.home.lan/"
        - name: grafana.grafana\.ini.server.serve_from_sub_path
          value: "false"
        # Bypass the chart's nginx sidecar (targetPort 8080): it caches
        # responses (incl. auth state) for up to 1d without varying by
        # session cookie, which broke login/logout. Direct access only;
        # this also skips the sidecar's Rancher-embedded-iframe URL rewrite.
        - name: grafana.service.targetPort
          value: "3000"
        - name: global.cattle.clusterId
          value: local
      valuesObject:
        # Surfaced 2026-09-27: no requests/limits at all, so the scheduler
        # had no visibility into prometheus-adapter's real ~930MB footprint
        # on k8s-master - unusually high for this component (normally
        # ~100-200Mi), but its logs showed nothing abnormal (plain healthz
        # probe traffic, no errors), so this is its real footprint here, not
        # a leak. `prometheus-adapter` is a genuine Helm subchart dependency
        # of this chart (confirmed via its Chart.yaml), so this key reaches
        # the subchart directly even though rancher-monitoring's own default
        # values.yaml doesn't document a resources passthrough for it.
        prometheus-adapter:
          # Surfaced 2026-09-27, same day as the memory fix above but a CPU
          # investigation: pve's new CPU-temperature monitoring (see
          # homelab-ansible/docs/cpu-temp-monitoring.md) showed pve.home.lan
          # running hot, traced to k8s-master pegging ~250% CPU, traced to
          # this pod alone burning ~1 full core. Root cause verified live via
          # its own container args (`kubectl get pod ... -o
          # jsonpath='{.spec.containers[0].args}'`): the chart's *default*
          # `logLevel: 4` (`--v=4`) logs full klog-structured detail for
          # every HTTP call, including the routine ~5-requests/30s discovery
          # polling from the apiserver's own aggregation layer — that
          # verbosity, not request volume, is what was visible in the logs.
          # Left `metricsRelistInterval` (default 1m) and the chart's broad
          # seriesQuery rules alone for now -- `kubectl get hpa -A` found
          # zero HPAs anywhere in this cluster, i.e. nothing currently
          # consumes custom.metrics.k8s.io at all, which is worth revisiting
          # (narrow the rules, or drop this component) before touching that
          # knob rather than just tuning it blind.
          logLevel: 2
          resources:
            requests:
              memory: 1Gi
              cpu: 100m
            limits:
              memory: 1536Mi
              # 500m is a defensive cap, not a measured comfortable ceiling:
              # chosen because metricsRelistInterval/seriesQuery breadth were
              # deliberately left untouched (see above), so this pod may still
              # legitimately want more than its 100m request under that 1m
              # relist cycle. The point is bounding it well under the ~1000m
              # it was observed sustaining, not preventing all throttling.
              cpu: 500m
          # Surfaced 2026-09-27: see the matching comment in
          # argocd/litellm/litellm.yaml - same fix, other direction
          # (avoiding rancher + litellm). Soft/preferred, and namespaces: is
          # load-bearing for the same same-namespace-default reason.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app
                          operator: In
                          values: ["rancher"]
                    namespaces: ["cattle-system"]
                    topologyKey: kubernetes.io/hostname
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values: ["litellm"]
                    namespaces: ["litellm"]
                    topologyKey: kubernetes.io/hostname
        grafana:
          sidecar:
            dashboards:
              # Lets ConfigMap-provisioned dashboards (dashboard-yugabytedb.yaml)
              # pick their folder via this annotation key. Without it the
              # sidecar ignores per-object folder placement and drops
              # everything in General.
              folderAnnotation: grafana_folder
              provider:
                # The sidecar writes the file into the right subfolder
                # (e.g. /tmp/dashboards/Homelab) regardless of this setting,
                # but Grafana's own file-provisioner still needs this to
                # turn that directory structure into an actual folder,
                # otherwise it re-flattens everything into General.
                foldersFromFilesStructure: true
          # Rancher's mirrored curl image (rancher/appco-curl) lacks sed,
          # which download_dashboards.sh needs for datasource rewriting.
          # Note: this chart fork joins registry+repository with no "/",
          # so leave registry empty and let Docker Hub be implicit.
          downloadDashboardsImage:
            registry: ""
            repository: curlimages/curl
            tag: 8.14.1
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: homelab
                  orgId: 1
                  folder: Homelab
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/homelab
          dashboards:
            homelab:
              argocd:
                gnetId: 14584
                revision: 1
                datasource: Prometheus
              cert-manager:
                gnetId: 20842
                revision: 3
                datasource: Prometheus
              longhorn:
                gnetId: 16888
                revision: 14
                datasource: Prometheus
              metallb:
                gnetId: 14127
                revision: 1
                datasource: Prometheus
              nginx-ingress:
                gnetId: 9614
                revision: 1
                datasource: Prometheus
              nvidia-dcgm:
                gnetId: 12239
                revision: 2
                datasource: Prometheus
                # No data until dcgm-exporter is actually scraped -- see
                # dcgm-exporter-servicemonitor.yaml in this directory.
              # YugabyteDB dashboard lives in dashboard-yugabytedb.yaml
              # instead (hand-patched copy of gnetId 12528; the stock
              # version's job picker had no filter/default and read empty).
    repoURL: https://charts.rancher.io
    # 2026-09-20: was 109.0.2+up80.9.1-rancher.8, which charts.rancher.io no
    # longer serves (removed from the index, tarball 404), so every sync failed
    # with "chart ... not found". 109.0.1 has the same upstream (80.9.1) and the
    # same Rancher build (.8). Dry-run against the live cluster showed only
    # chart-version label changes, no workload image or pod-template changes.
    targetRevision: 109.0.1+up80.9.1-rancher.8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

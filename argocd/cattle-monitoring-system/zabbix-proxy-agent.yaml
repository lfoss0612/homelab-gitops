apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabbix-proxy-agent
  namespace: argocd
spec:
  destination:
    namespace: cattle-monitoring-system
    server: https://kubernetes.default.svc
  project: add-ons
  source:
    chart: zabbix-helm-chrt
    helm:
      parameters:
        # This cluster already runs kube-state-metrics via the Rancher
        # monitoring stack (rancher-monitoring-kube-state-metrics in this
        # same namespace) - don't deploy a second one.
        - name: kubeStateMetrics.enabled
          value: "false"
        - name: zabbixAgent.enabled
          value: "true"
      valuesObject:
        # zabbixProxy.env is a list of {name, value} pairs (K8s env-var
        # style), not a nested map - `--set zabbixProxy.env.KEY=value`
        # style parameters get silently dropped by Helm's coalesce (type
        # mismatch: list vs map), which is why this must be a full list
        # override here instead of individual helm.parameters entries.
        # Confirmed via the chart's own values.yaml
        # (git.zabbix.com/projects/ZT/repos/kubernetes-helm, release/7.4)
        # - only ZBX_HOSTNAME and ZBX_SERVER_HOST actually change from
        # the chart defaults; the rest are carried over unchanged since
        # Helm replaces (doesn't merge) list values.
        zabbixProxy:
          env:
            - name: ZBX_PROXYMODE
              value: "0"
            - name: ZBX_HOSTNAME
              value: rke2-proxy
            # Zabbix server on zabbix.home.lan (10.0.5.9) lives outside
            # this cluster on 10.0.5.x - it cannot reach pod IPs on the
            # CNI overlay network, which blocked kube-state-metrics
            # scraping and Kubelet/control-plane metrics from Zabbix's
            # Kubernetes templates entirely (confirmed via
            # zabbix_server.log: "cannot get URL: Connection timed
            # out"). This proxy runs inside the cluster instead, where
            # pod IPs ARE reachable, and relays data back to the
            # external server in active mode. IP used instead of
            # hostname to avoid a dependency on cluster DNS resolving
            # external .home.lan names.
            - name: ZBX_SERVER_HOST
              value: "10.0.5.9:10051"
            - name: ZBX_DEBUGLEVEL
              value: "3"
            - name: ZBX_CACHESIZE
              value: 128M
            - name: ZBX_STARTJAVAPOLLERS
              value: "0"
            - name: ZBX_PROXYCONFIGFREQUENCY
              value: "10"
        # Without this the DaemonSet skips k8s-master.home.lan (RKE2's
        # default node-role.kubernetes.io/control-plane:NoSchedule taint),
        # leaving it uncovered for Kubelet-level metrics. zabbixAgent.env
        # defaults (ZBX_SERVER_HOST=0.0.0.0/0, ZBX_PASSIVE_ALLOW=true)
        # already work unmodified for the proxy-polls-agents topology -
        # the proxy queries each agent pod passively from inside the
        # cluster, then reports up to the external server itself.
        zabbixAgent:
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
          # Lets the DaemonSet report each node's installed openclaw version to
          # Zabbix (item key openclaw.version), which the 11 hosts running their
          # own agent2 already do via a drop-in from homelab-ansible's
          # openclaw.node.common role. These three nodes have no host-level
          # agent since that role stopped installing one, so their drop-in is
          # written to the node's filesystem and mounted in here instead.
          #
          # extraHostVolumeMounts (hostPath) rather than a ConfigMap because
          # chart 1.5.8 offers no extraVolumes/extraObjects hook at all - its
          # only volume escape hatch is this one, verified against
          # `helm show values` for that exact version.
          #
          # Mounted at zabbix_agentd.d, NOT zabbix_agent2.d: both are on the
          # container's Include list, but zabbix_agent2.d holds plugins.d and
          # mounting over it would shadow the image's own plugin configs.
          # zabbix_agentd.d is empty in the image, so nothing is lost.
          #
          # The hostPath must already exist - the chart sets no hostPath `type`,
          # so kubelet will not create a missing directory and the pod would
          # fail to start. homelab-ansible creates it (and the drop-in inside
          # it) via playbooks/deploy-openclaw-version-userparam.yml, which must
          # therefore run BEFORE this change syncs.
          extraHostVolumeMounts:
            - name: openclaw-userparams
              hostPath: /etc/zabbix/agent2-userparams.d
              mountPath: /etc/zabbix/zabbix_agentd.d
              readOnly: true
    repoURL: https://cdn.zabbix.com/zabbix/integrations/kubernetes-helm/7.4
    # appVersion 7.4.1 - closest available match to the external Zabbix
    # server's 7.4.13 (confirmed via `dpkg -l | grep zabbix-server` on
    # zabbix.home.lan). Zabbix requires matching major.minor between
    # server and proxy; same-minor patch differences are fully supported.
    targetRevision: 1.5.8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langflow-ide
  namespace: argocd
spec:
  destination:
    namespace: langflow
    server: https://kubernetes.default.svc
  project: ai
  source:
    chart: langflow-ide
    helm:
      parameters:
        - name: nameOverride
          value: langflow-service
        - name: langflow.frontend.service.type
          value: LoadBalancer
      valuesObject:
        langflow:
          backend:
            # Pinned: `latest` + IfNotPresent let each node's image cache decide
            # which code ran, so the pod could land on a node whose cached
            # `latest` was older than the schema already written to the PVC.
            # Alembic then saw only remove_* ops and refused to boot.
            # backend and frontend are versioned independently upstream --
            # langflowai/langflow-frontend has no 1.12.2 tag.
            image:
              tag: "1.12.2"
            env:
              - name: LANGFLOW_PORT
                value: "7860"
              - name: LANGFLOW_ALEMBIC_LOG_FILE
                value: /app/db/alembic.log
              - name: LANGFLOW_UPDATE_STARTER_PROJECTS
                value: "false"
              # langflow now refuses to boot without explicit superuser
              # credentials; secret is created out-of-band (kubectl), not in git
              - name: LANGFLOW_SUPERUSER
                valueFrom:
                  secretKeyRef:
                    name: langflow-superuser
                    key: username
              - name: LANGFLOW_SUPERUSER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: langflow-superuser
                    key: password
          frontend:
            image:
              tag: "1.12.0"
    repoURL: https://langflow-ai.github.io/langflow-helm-charts
    targetRevision: 0.1.2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
